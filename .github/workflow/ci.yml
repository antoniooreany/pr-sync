name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  spec-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -U pip
          # если используешь uv/poetry/pip-tools — тут подстроить
          pip install -e .[dev] || pip install -r requirements.txt

      - name: Validate specs presence
        run: |
          test -f .specify/constitution.md
          test -f specs/001-automation-toolkit/spec.md
          test -f specs/001-automation-toolkit/plan.md
          test -f specs/001-automation-toolkit/tasks.md

      - name: Check for TODO/FIXME in specs (excluding templates and memory)
        run: |
          if grep -R "TODO\|FIXME\|XXX" .specify specs/001-automation-toolkit \
            --exclude-dir=".specify/templates" \
            --exclude-dir=".specify/memory"; then
            echo "::error::Unresolved TODO/FIXME markers in core specifications"
            exit 1
          fi

      - name: Run tests
        run: |
          pytest -v
