name: docs-assistant

on:
  issue_comment:
    types: [created]

jobs:
  review-pr:
    # Only run on PR comments containing [review-pr]
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '[review-pr]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout PR branch
        run: gh pr checkout ${{ github.event.issue.number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pr-sync
        run: pip install -e .

      - name: Run pr-sync to update PR
        run: pr-sync --base ${{ github.event.issue.pull_request.base.ref || 'develop' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLLAMA_MODEL: ""
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Acknowledge in comment
        run: |
          gh pr comment ${{ github.event.issue.number }} \
            --body "✅ **docs-assistant** updated this PR's title, body, and labels."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
