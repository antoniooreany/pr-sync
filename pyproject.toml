[project]
name = "automation-toolkit"
version = "0.1.0"
description = "A family of small, focused automation tools."
authors = [
    {name = "antoniooreany"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
pr-sync = "toolkit.cli:main"

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
